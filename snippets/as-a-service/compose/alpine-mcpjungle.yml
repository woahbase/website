---
services:
  mcpjungle:
    container_name: mcpjungle
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-995}  # gid of group docker on the host
      SERVER_MODE: development
      PORT: ${MCPJUNGLE_PORT:-8080}
      # TZ: ${TZ}
    # healthcheck:
    #   test:
    #     - CMD-SHELL
    #     - >-
    #        wget --quiet --tries=1 --no-check-certificate --spider
    #        ${HEALTHCHECK_URL:-"http://localhost:${MCPJUNGLE_PORT:-8080}/health"} || exit 1
    #   interval: 2m
    #   timeout: 10s
    #   retries: 5
    #   start_period: 5m
    hostname: mcpjungle
    image: woahbase/alpine-mcpjungle:${MCPJUNGLE_TAG:-latest}
    network_mode: bridge
    ports:
      - protocol: tcp
        host_ip: 0.0.0.0
        published: ${MCPJUNGLE_PORT:-8080}
        target: ${MCPJUNGLE_PORT:-8080}
    volumes:
      - type: bind
        source: ${MCPJUNGLE_DIR:?err}/config
        target: /config
        bind:
          create_host_path: true
      # # only required if using docker base mcp-servers
      # - type: bind
      #   source: /var/run/docker.sock
      #   target: /var/run/docker.sock
      #   bind:
      #     create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
